# ==============================================================================
# GameHost Deployer — Dev Compose (bind-mount source for hot-reload)
# Usage: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

version: '3.9'

services:
  gamehost-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gamehost-dev
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      # Bind-mount the entire project for live code changes (tsx watches)
      - .:/app
      # Prevent node_modules from being overridden by the host
      - /app/node_modules

      # Docker socket for game container provisioning
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent data between restarts
      - gamehost-dev-data:/app/data

    environment:
      - NODE_ENV=development
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-gamehost-backups}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - DEFAULT_DISCORD_WEBHOOK_URL=${DEFAULT_DISCORD_WEBHOOK_URL:-}

    networks:
      - gamehost-dev-net

volumes:
  gamehost-dev-data:
    driver: local

networks:
  gamehost-dev-net:
    driver: bridge
