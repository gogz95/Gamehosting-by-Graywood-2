# ==============================================================================
# GameHost Deployer & Proxy — Docker Compose Stack
# Supports: Master Panel + Nginx Reverse Proxy (TLS termination)
# ==============================================================================

version: '3.9'

services:

  # ─── Master Panel (Node.js API + Vite-built React UI) ─────────────────────
  gamehost-panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: gamehost-panel:latest
    container_name: gamehost-master
    restart: unless-stopped

    ports:
      # Expose only to Nginx internally; remove if you want direct access
      - "3000:3000"

    volumes:
      # Docker socket — allows the panel to manage game server containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data: database, server volumes, backups
      - gamehost-data:/app/data

    environment:
      - NODE_ENV=production
      - PORT=3000
      # ── Optional: override if Docker daemon is on a different host ──────────
      - DOCKER_HOST=${DOCKER_HOST:-}
      # ── AI Crash Diagnosis ─────────────────────────────────────────────────
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # ── S3 / Cloudflare R2 Cloud Backups ──────────────────────────────────
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-gamehost-backups}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-auto}
      # ── Discord Alert Webhooks ─────────────────────────────────────────────
      - DEFAULT_DISCORD_WEBHOOK_URL=${DEFAULT_DISCORD_WEBHOOK_URL:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - gamehost-net

  # ─── Nginx Reverse Proxy (TLS termination, HTTP→HTTPS redirect) ────────────
  nginx:
    image: nginx:alpine
    container_name: gamehost-nginx
    restart: unless-stopped
    depends_on:
      gamehost-panel:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx config — edit nginx/nginx.conf to set your domain & SSL certs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates (e.g. from Let's Encrypt / Certbot)
      - ./nginx/certs:/etc/nginx/certs:ro
      # Certbot webroot for ACME challenge (optional)
      - ./nginx/webroot:/var/www/certbot:ro

    networks:
      - gamehost-net

# ─── Named Volume for persistent cluster data ──────────────────────────────
volumes:
  gamehost-data:
    driver: local

# ─── Internal bridge network ───────────────────────────────────────────────
networks:
  gamehost-net:
    driver: bridge
