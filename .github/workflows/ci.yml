name: GameHost CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (Lint)
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Distribution Output
        run: |
          test -f dist/index.html || exit 1
          test -f dist/server.cjs || exit 1
          echo "Build verification passed: dist/index.html and dist/server.cjs are valid."
