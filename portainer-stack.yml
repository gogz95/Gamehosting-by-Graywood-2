# ==============================================================================
# portainer-stack.yml — GameHost Deployer Portainer Stack
# Deploy via: Portainer UI → Stacks → Add Stack → Web editor (paste this file)
# Or via CLI: portainer-cli stack deploy gamehost -f portainer-stack.yml
# Compatible with: Portainer CE & BE, Portainer Stacks (Docker Compose v3)
# ==============================================================================

version: '3.9'

services:

  # ─── Master Panel ──────────────────────────────────────────────────────────
  gamehost-panel:
    image: ghcr.io/YOUR_GITHUB_USERNAME/gamehost-deployer-proxy:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: gamehost-master
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gamehost-data:/app/data

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_HOST=
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET:-gamehost-backups}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-auto}
      - DEFAULT_DISCORD_WEBHOOK_URL=${DEFAULT_DISCORD_WEBHOOK_URL}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - gamehost-net

  # ─── Nginx Reverse Proxy + TLS ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gamehost-nginx
    restart: unless-stopped
    depends_on:
      - gamehost-panel

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - nginx-config:/etc/nginx/conf.d
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-webroot:/var/www/certbot:ro

    networks:
      - gamehost-net

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  gamehost-data:
    driver: local
  nginx-config:
    driver: local
  nginx-certs:
    driver: local
  nginx-webroot:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  gamehost-net:
    driver: bridge
